# Puts every new issue on the project board. The default GITHUB_TOKEN cannot
# write to a user-level project, so this needs ADD_TO_PROJECT_PAT, a classic
# PAT with the project scope, as a repo secret. The board's own auto-add
# workflow is the zero-secret alternative; bootstrap.sh's checklist covers it.
name: add-to-project

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  add:
    name: Add to the board
    # Inert until bootstrap.sh sets the PROJECT_URL repo variable
    if: vars.PROJECT_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
